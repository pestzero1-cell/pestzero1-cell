<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈페이지</title>
<meta name="description" content="">
<style>
:root{--bg:#fff;--fg:#1c2b25;--muted:#5d6b64;--card:#f3f8f5;--line:#dfe8e3;--brand:#12408f;--brand-d:#0c2f6e;--accent:#e5531d;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#101815;--fg:#e8f0ec;--muted:#9bb0a6;--card:#17231e;--line:#27382f;--brand:#6ea0ff;--brand-d:#8fb6ff;--accent:#ff7a45;--on:#08162f}}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:-apple-system,"Pretendard","Noto Sans KR",sans-serif;background:var(--bg);color:var(--fg);line-height:1.65}
a{color:inherit;text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.sample{background:var(--accent);color:#3a2800;text-align:center;font-size:.85rem;padding:6px 12px;font-weight:700}
header{position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.logo{display:flex;align-items:center;gap:10px;color:var(--brand)}
.mark{width:38px;height:38px;border-radius:10px;background:var(--brand);color:var(--on);display:grid;place-items:center;font-weight:800}
.logo b{display:block;font-size:1.3rem;line-height:1.1}
.logo small{display:block;font-size:.72rem;color:var(--muted)}
.tel{font-weight:800;color:var(--accent);white-space:nowrap}
.bar{background:var(--brand)}
.bar .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.bar a{color:var(--on);white-space:nowrap;padding:12px 14px;font-size:.92rem;font-weight:600}
.bar a:hover{background:rgba(255,255,255,.14)}
.hero{padding:40px 0 48px;background:linear-gradient(180deg,var(--card),var(--bg))}
.hero-in{display:grid;gap:32px;grid-template-columns:1fr;align-items:center}
@media(min-width:800px){.hero-in{grid-template-columns:1fr 1.15fr}}
.badge{display:inline-block;font-size:.8rem;font-weight:700;background:var(--brand);color:var(--on);padding:3px 10px;border-radius:4px}
.kicker{margin-top:10px;color:var(--accent);font-weight:800;font-size:1.3rem}
.deal{font-size:1.15rem;font-weight:800;margin-top:6px}
.hero h1{font-size:clamp(2rem,6vw,3.1rem);line-height:1.2;font-weight:800;margin-top:6px}
.hero h1 span{font-weight:400}
.hbul{list-style:none;padding:0;margin:14px 0 22px;color:var(--brand);font-weight:600;font-size:.95rem}
.hbul li:last-child{color:var(--muted);font-weight:400}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(6,1fr)}
.tiles div{grid-column:span 2;aspect-ratio:1;border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--line),var(--card));display:flex;align-items:flex-end}
.tiles div:nth-child(4),.tiles div:nth-child(5){grid-column:span 3;aspect-ratio:3/2}
.tiles img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tiles span{position:relative;width:100%;padding:6px 8px;background:rgba(0,0,0,.55);color:#fff;font-size:.82rem;font-weight:700}
.about{display:grid;gap:24px;grid-template-columns:minmax(0,1fr)}
.about>*{min-width:0}
@media(min-width:800px){.about{grid-template-columns:260px minmax(0,1fr);gap:40px}}
.about-side h2{background:var(--brand);color:var(--on);padding:28px 22px;margin:0;border-radius:4px 4px 0 0}
.tabs,.ptabs{display:flex;flex-wrap:wrap;border:1px solid var(--line);border-top:0}
.tabs button,.ptabs button{flex:1 1 auto;text-align:left;padding:13px 18px;background:transparent;color:var(--fg);border-bottom:1px solid var(--line)}
@media(min-width:800px){.tabs,.ptabs{flex-direction:column}}
.tabs button[aria-selected=true],.ptabs button[aria-selected=true]{background:var(--card);color:var(--brand);font-weight:700}
.about-main h3{font-size:1.6rem;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.about-main .lead{font-size:clamp(1.3rem,3.4vw,1.8rem);line-height:1.4;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px}
.about-main .lead em{font-style:normal;color:var(--brand)}
.about-main p{margin-bottom:14px;max-width:62ch}
.slogan{text-align:center;font-size:1.1rem;color:var(--muted);padding:14px 0;border-block:1px solid var(--line)}
.slogan b{color:var(--brand)}
.ceo{margin:24px auto;max-width:300px;text-align:center;font-weight:800;font-size:1.4rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.teams{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:start}
.team{border:1px solid var(--line)}
.team h4{text-align:center;padding:10px;background:var(--card);border-top:3px solid var(--brand)}
.team:nth-child(even) h4{border-top-color:var(--accent)}
.team li{list-style:none;text-align:center;padding:12px 6px;color:var(--muted);font-size:.92rem}
.pbanner{background:linear-gradient(100deg,var(--brand-d),var(--brand));color:var(--on);padding:36px 0}
.pbanner small{opacity:.85;font-size:.95rem}
.pbanner b{display:block;font-size:clamp(1.6rem,5vw,2.4rem);line-height:1.2;margin-top:4px}
.pbanner span{display:block;font-size:clamp(1.3rem,4vw,1.9rem)}
.about-main h4.ph{font-size:1.2rem;color:var(--brand);margin:28px 0 10px}
.about-main h4.ph:first-of-type{margin-top:0}
.red{color:#c8321e;font-size:.9rem;margin-bottom:6px;max-width:none}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]) .red{color:#ff8a70}}
:root[data-theme=dark] .red{color:#ff8a70}
.tbl{overflow-x:auto;margin:14px 0}
.tbl table{border-collapse:collapse;width:100%;min-width:560px;font-size:.9rem;border-top:2px solid var(--muted)}
.tbl th{background:var(--card);font-weight:600}
.tbl th,.tbl td{border:1px solid var(--line);padding:9px 10px;text-align:center}
.tbl td:first-child{white-space:nowrap}
.bl{padding-left:18px;color:var(--muted);font-size:.92rem;margin:12px 0}
.bl li{margin-bottom:4px}
.safe{font-size:1.2rem;font-weight:800;margin:20px 0 0;max-width:none}
.pimg{display:block;max-width:100%;height:auto;margin:18px 0 8px}
.pgrid{display:grid;gap:12px;margin:18px 0;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.pgrid img{width:100%;height:auto;border:1px solid var(--line);border-radius:8px}
.sysSteps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));margin:20px 0 32px;text-align:center}
.sysSteps b{display:block;font-size:1.3rem;margin-bottom:10px}
.sysSteps svg{color:var(--muted);opacity:.7}
.sysSteps p{font-size:.88rem;color:var(--muted);margin:10px 0 0;max-width:none}
.sysSteps p b{display:inline;font-size:inherit;color:var(--brand);margin:0}
.contact-card{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);margin:14px 0 30px;min-height:140px}
@media(max-width:560px){.contact-card{grid-template-columns:1fr}.cc-img{min-height:120px}}
.contact-card>div:first-child{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:14px;padding:20px}
.bigtel{display:block;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 28px;font-size:1.5rem;color:var(--brand);font-weight:700}
.cc-img{background:linear-gradient(135deg,var(--line),var(--card)) center/cover}
.cellimg{max-width:64px;height:auto;max-height:70px}
.introbox{background:var(--card);border:1px solid var(--line);padding:14px 16px;margin:0 0 18px;max-width:none}
.tbl td{vertical-align:middle}
.btbl{width:100%;border-collapse:collapse;font-size:.92rem;border-top:2px solid var(--fg)}
.btbl th{padding:10px 6px;border-bottom:1px solid var(--line);font-weight:600}
.btbl td{padding:12px 6px;border-bottom:1px solid var(--line);text-align:center;color:var(--muted)}
.btbl td.t{text-align:left;color:var(--fg)}
.btbl td.t a{cursor:pointer}.btbl td.t a:hover{color:var(--brand);text-decoration:underline}
.btbl .rc{color:var(--brand);margin-left:4px}
@media(max-width:600px){.btbl .hm{display:none}}
.btop{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 10px;color:var(--muted);font-size:.9rem}
.btop select{width:auto;padding:6px 10px}
.bpager{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin:22px 0}
.bpager button{min-width:34px;height:34px;background:var(--card);color:var(--muted);border-radius:4px}
.bpager button[aria-current=true]{background:var(--brand);color:var(--on);font-weight:700}
.bbtn{display:inline-block;padding:9px 18px;border-radius:6px;background:var(--card);color:var(--fg);border:1px solid var(--line);margin:4px 4px 0 0}
.bbtn.pri{background:var(--brand);color:var(--on);border-color:var(--brand)}
.bform{display:grid;gap:12px;max-width:none}
.bform label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
.bview h4{font-size:1.2rem;margin-bottom:10px}
.bmeta{display:flex;flex-wrap:wrap;gap:6px 18px;background:var(--card);padding:10px 14px;font-size:.88rem;color:var(--muted);margin-bottom:14px}
.bbody{white-space:pre-wrap;line-height:1.8;margin:14px 0}
.bbody img{display:block;max-width:100%;height:auto;margin-top:12px;border-radius:6px}
.breply{border-left:4px solid var(--accent);background:var(--card);padding:12px 16px;margin:16px 0}
.breply b{color:var(--accent)}
.btoast{background:var(--brand);color:var(--on);padding:10px 14px;border-radius:6px;margin-bottom:12px}
.berr{color:#c8321e;font-size:.88rem}
.soon{padding:40px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
.btn.cta{background:var(--accent);color:#fff}
.btn{display:inline-block;padding:13px 26px;border-radius:999px;background:var(--brand);color:var(--on);font-weight:700;margin:4px}
.btn:hover{background:var(--brand-d)}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.btn.cta:hover{filter:brightness(.92)}
section{padding:56px 0;scroll-margin-top:110px}
section.alt{background:var(--card)}
h2{font-size:1.6rem;margin-bottom:8px}
.sub{color:var(--muted);margin-bottom:28px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
.alt .card{background:var(--bg)}
.card .ico{font-size:2rem}
.card h3{margin:8px 0 6px}
.card ul{padding-left:18px;color:var(--muted);font-size:.95rem}
.tag{display:inline-block;font-size:.75rem;background:var(--brand);color:var(--on);border-radius:999px;padding:2px 10px}
.why{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.why div{padding:20px;border-radius:16px;border:1px solid var(--line)}
.why b{display:block;margin:6px 0 4px}
.why span{color:var(--muted);font-size:.93rem}
.steps{counter-reset:s;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.steps div{counter-increment:s;border-left:4px solid var(--accent);padding:6px 14px}
.steps div::before{content:"0" counter(s);font-weight:800;color:var(--accent)}
.steps b{display:block}
.steps span{color:var(--muted);font-size:.92rem}
.shot{aspect-ratio:4/3;border-radius:12px;background:linear-gradient(135deg,var(--line),var(--card));display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem;overflow:hidden;margin-bottom:12px}
.shot img{width:100%;height:100%;object-fit:cover}
.meta{font-size:.82rem;color:var(--muted)}
.stars{color:var(--accent);letter-spacing:2px}
.area{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.area span{border:1px solid var(--brand);color:var(--brand);border-radius:999px;padding:4px 14px;font-size:.9rem}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px}
summary{cursor:pointer;font-weight:700}
details p{margin-top:8px;color:var(--muted)}
form{display:grid;gap:12px;max-width:520px}
input,select,textarea{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);width:100%}
button{font:inherit;border:0;cursor:pointer}
.note{font-size:.85rem;color:var(--muted)}
footer{border-top:1px solid var(--line);padding:32px 0;color:var(--muted);font-size:.88rem}
.fab{position:fixed;right:16px;bottom:16px;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.25)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<noscript>자바스크립트를 켜주세요.</noscript>
<script src="content.js"></script>
<script>
(function(){
  var S=window.SITE||{};
  var $=function(s){return document.querySelector(s)};
  // 모든 문자열을 이스케이프해서 삽입 (content.js 에 특수문자가 있어도 안전)
  var e=function(t){return String(t==null?"":t).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
  var list=function(a,fn){return (a||[]).map(fn).join("")};
  var tel="tel:"+String(S.phone||"").replace(/[^0-9+]/g,"");
  var sample=S.sampleMode?'<div class="sample">⚠ 예시 내용입니다 — content.js 에서 실제 내용으로 바꿔주세요</div>':"";
  var h=S.hero||{};
  var cell=function(c,b){if(c&&c.img)return '<td style="text-align:center"><img class="cellimg" loading="lazy" src="'+e(c.img)+'" alt="'+e(c.t)+'"><br><span style="font-size:.85rem;color:var(--muted)">'+e(c.t)+'</span></td>';var o=typeof c==="object",t=e(o?c.t:c).replace(/\n/g,"<br>");return '<td'+(o&&c.rs?' rowspan="'+c.rs+'"':'')+(o&&c.cs?' colspan="'+c.cs+'"':'')+((b||(o&&c.b))?' style="font-weight:700"':'')+'>'+t+'</td>'};
  var tbl=function(t){return t?'<div class="tbl"><table><thead>'+(t.caption?'<tr><th colspan="'+t.head.length+'">'+e(t.caption)+'</th></tr>':'')+'<tr>'+list(t.head,function(x){return '<th>'+e(x)+'</th>'})+'</tr></thead><tbody>'+list(t.rows,function(r){return '<tr>'+list(r,function(c,i){return cell(c,t.boldCols&&t.boldCols.indexOf(i)>=0)})+'</tr>'})+'</tbody></table></div>':''};
  var psec=function(s){return (s.imageTop?'<img class="pimg" loading="lazy" src="'+e(s.imageTop)+'" alt="">':'')+(s.heading?'<h4 class="ph">'+e(s.heading)+'</h4>':'')+(s.intro?'<p class="introbox">'+e(s.intro).replace(/\n/g,'<br>')+'</p>':'')+(s.lead?'<p class="safe" style="margin:8px 0 14px">◆ '+e(s.lead)+'</p>':'')+list(s.notes,function(n){return '<p class="red">※ '+e(n)+'</p>'})+(s.bulletsFirst?(s.bullets?'<ul class="bl">'+list(s.bullets,function(b){return '<li>'+e(b)+'</li>'})+'</ul>':''):'')+tbl(s.table)+(s.afterNote?'<p class="red">※ '+e(s.afterNote)+'</p>':'')+(s.bulletsFirst?'':(s.bullets?'<ul class="bl">'+list(s.bullets,function(b){return '<li>'+e(b)+'</li>'})+'</ul>':''))+(s.images?'<div class="pgrid">'+list(s.images,function(x){return '<img loading="lazy" src="'+e(x)+'" alt="">'})+'</div>':'')+(s.image?'<img class="pimg" loading="lazy" src="'+e(s.image)+'" alt="">':'')+(s.footer?'<p class="safe">◆ '+e(s.footer)+'</p>':'')};
  var fmt=function(t){return e(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>")};
  var ICONS={
    monitor:'<svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><rect x="8" y="10" width="48" height="34" rx="4"/><path d="M22 54h20M32 44v10"/></svg>',
    click:'<svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="10" width="44" height="32" rx="4"/><path d="M18 52h20M28 42v10M40 28l14 8-6 2 5 8-4 2-5-8-4 4z"/></svg>',
    note:'<svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M14 12h36v30L38 54H14z"/><path d="M38 54V42h12M22 8v8M32 8v8M42 8v8M22 26h20M22 34h14"/></svg>',
    phone:'<svg viewBox="0 0 64 64" width="72" height="72" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10l8 2 4 10-6 4c3 8 7 12 14 16l4-6 10 4 2 8c-4 6-12 6-20 2C18 42 10 30 10 20c0-6 2-9 6-10z"/><path d="M40 8h14v10H46l-4 4z"/></svg>'
  };
  var stepsHtml=function(s){return s.steps?'<div class="sysSteps">'+list(s.steps,function(x,i){return '<div><b>0'+(i+1)+'</b>'+(ICONS[x.icon]||'')+'<p>'+fmt(x.text)+'</p></div>'})+'</div>':''};
  var contactHtml=function(s){return s.contact?'<div class="contact-card"><div><b>'+e(s.contact.label)+'</b><span class="bigtel">'+e(s.contact.phone)+'</span></div><div class="cc-img"'+(s.contact.image?' style="background-image:url(\''+e(s.contact.image)+'\')"':'')+'></div></div>':''};
  var pageHtml=function(id,P,soon){return P?'<section id="'+id+'" style="padding:0">'+(P.banner?'<div class="pbanner"'+(P.banner.image?' style="background-image:linear-gradient(100deg,rgba(12,47,110,.95) 35%,rgba(12,47,110,.2)),url(\''+e(P.banner.image)+'\');background-size:cover;background-position:right center"':'')+'><div class="wrap"><small>'+e(P.banner.small)+'</small><b>'+e(P.banner.title)+'</b><span>'+e(P.banner.sub)+'</span></div></div>':'')+
    '<div class="wrap about" style="padding-block:40px"><aside class="about-side"><h2>'+e(P.title)+'</h2><div class="ptabs" role="tablist">'+
    list(P.items,function(it,i){return '<button type="button" role="tab" data-p="'+i+'" aria-selected="'+(i===0)+'">'+e(it.label)+'</button>'})+'</div></aside><div class="about-main">'+
    list(P.items,function(it,i){return '<div class="pp" id="pp-'+id+'-'+i+'"'+(i?' hidden':'')+'><h3>'+e(it.label)+'</h3>'+((it.sections||[]).length?list(it.sections,function(s){return psec(s)+stepsHtml(s)+contactHtml(s)}):'<p class="soon">'+soon+'</p>')+'</div>'})+
    '</div></div></section>':''};
  var priceHtml=pageHtml("price",S.price,"단가표 준비 중입니다. 전화로 문의해 주세요.");
  var infoHtml=pageHtml("info",S.info,"내용 준비 중입니다. 전화로 문의해 주세요.");
  var drainHtml=pageHtml("drain",S.drain,"내용 준비 중입니다. 전화로 문의해 주세요.");
  var supportHtml=S.board?'<section id="support" style="padding:0"><div class="wrap about" style="padding-block:40px"><aside class="about-side"><h2>'+e(S.board.title)+'</h2><div class="ptabs" id="btabs" role="tablist">'+list(S.board.boards,function(b,i){return '<button type="button" role="tab" data-b="'+e(b.id)+'" aria-selected="'+(b.id==="inquiry")+'">'+e(b.label)+'</button>'})+'</div></aside><div class="about-main" id="board-main"></div></div></section>':'';
  var systemHtml=pageHtml("system",S.system,"내용 준비 중입니다. 전화로 문의해 주세요.");


  var tiles=(h.tiles||[]).map(function(t){return '<div>'+(t.image?'<img loading="lazy" src="'+e(t.image)+'" alt="'+e(t.label)+'">':'')+'<span>'+e(t.label)+'</span></div>'}).join("");

  var html=sample+
  '<header><div class="wrap top"><a class="logo" href="#top"><span class="mark">H</span><span><b>'+e(S.brand)+'</b><small>'+e(S.tagline)+'</small></span></a>'+
    '<a class="tel" href="'+e(tel)+'">☎ '+e(S.phone)+'</a></div>'+
    '<nav class="bar"><div class="wrap">'+list(S.menu,function(m){return '<a href="'+e(m.href)+'">'+e(m.label)+'</a>'})+'</div></nav></header>'+
  '<main id="top"><div class="hero"><div class="wrap hero-in"><div>'+
    '<span class="badge">'+e(h.badge)+'</span><p class="kicker">'+e(h.kicker)+'</p><p class="deal">'+e(h.deal)+'</p>'+
    '<h1>'+e(h.title)+'<br><span>'+e(h.highlight)+'</span></h1>'+
    '<ul class="hbul">'+list(h.bullets,function(b){return '<li>'+e(b)+'</li>'})+'</ul>'+
    '<a class="btn cta" href="#contact">'+e(h.button1)+'</a><a class="btn ghost" href="#why">'+e(h.button2)+'</a></div>'+
    '<div class="tiles">'+tiles+'</div></div></div>'+

  '<section id="services"><div class="wrap"><h2>서비스</h2><p class="sub">필요한 분야만 골라 맡기세요.</p><div class="grid">'+
    list(S.services,function(x){return '<div class="card"><div class="ico">'+e(x.icon)+'</div><span class="tag">'+e(x.tag)+'</span><h3>'+e(x.name)+'</h3><ul>'+list(x.items,function(i){return '<li>'+e(i)+'</li>'})+'</ul></div>'})+
  '</div></div></section>'+

  ((S.about)?'<section id="about"><div class="wrap about"><aside class="about-side"><h2>'+e(S.about.title)+'</h2><div class="tabs" role="tablist"><button type="button" role="tab" data-tab="g" aria-selected="true">'+e(S.about.greeting.title)+'</button><button type="button" role="tab" data-tab="o" aria-selected="false">'+e(S.about.org.title)+'</button></div></aside>'+
    '<div class="about-main"><div id="tab-g"><h3>'+e(S.about.greeting.title)+'</h3><p class="lead">'+e(S.about.greeting.headline)+'<br><em>'+e(S.about.greeting.highlight)+'</em></p>'+list(S.about.greeting.paragraphs,function(p){return '<p>'+e(p)+'</p>'})+'</div>'+
    '<div id="tab-o" hidden><h3>'+e(S.about.org.title)+'</h3><p class="slogan">'+e(S.about.org.slogan)+'</p><div class="ceo">'+e(S.about.org.ceo)+'</div><div class="teams">'+list(S.about.org.teams,function(t){return '<div class="team"><h4>'+e(t.name)+'</h4><ul style="padding:0">'+list(t.members,function(m){return '<li>'+e(m)+'</li>'})+'</ul></div>'})+'</div></div></div></div></section>':'')+

  priceHtml+systemHtml+infoHtml+drainHtml+supportHtml+

  '<section id="why" class="alt"><div class="wrap"><h2>왜 저희일까요</h2><p class="sub">작은 업체라서 가능한 방식입니다.</p><div class="why">'+
    list(S.why,function(x){return '<div><span style="font-size:1.6rem">'+e(x.icon)+'</span><b>'+e(x.title)+'</b><span>'+e(x.text)+'</span></div>'})+'</div></div></section>'+

  '<section id="process"><div class="wrap"><h2>진행 순서</h2><p class="sub">전화 한 통이면 시작됩니다.</p><div class="steps">'+
    list(S.steps,function(x){return '<div><b>'+e(x.title)+'</b><span>'+e(x.text)+'</span></div>'})+'</div></div></section>'+

  ((S.gallery||[]).length?'<section id="gallery" class="alt"><div class="wrap"><h2>시공 사례</h2><p class="sub">실제 현장 기록입니다.</p><div class="grid">'+
    list(S.gallery,function(x){return '<div class="card"><div class="shot">'+(x.image?'<img loading="lazy" src="'+e(x.image)+'" alt="'+e(x.title)+'">':'사진 자리')+'</div><span class="tag">'+e(x.tag)+'</span><h3>'+e(x.title)+'</h3><p class="meta">'+e(x.area)+'</p><p style="color:var(--muted);font-size:.93rem;margin-top:6px">'+e(x.text)+'</p></div>'})+
  '</div></div></section>':'')+

  ((S.reviews||[]).length?'<section id="reviews"><div class="wrap"><h2>고객 후기</h2><p class="sub">&nbsp;</p><div class="grid">'+
    list(S.reviews,function(x){return '<div class="card"><div class="stars">'+"★".repeat(x.stars||5)+'</div><p style="margin:8px 0">'+e(x.text)+'</p><p class="meta">'+e(x.name)+' · '+e(x.area)+'</p></div>'})+
  '</div></div></section>':'')+

  '<section id="faq" class="alt"><div class="wrap"><h2>자주 묻는 질문</h2><p class="sub">&nbsp;</p>'+
    list(S.faq,function(x){return '<details><summary>'+e(x.q)+'</summary><p>'+e(x.a)+'</p></details>'})+'</div></section>'+

  '<section id="contact"><div class="wrap"><h2>문의하기</h2><p class="sub">남겨주시면 확인 후 바로 연락드립니다.</p>'+
    ((S.areas||[]).length?'<div class="area">'+list(S.areas,function(a){return '<span>'+e(a)+'</span>'})+'</div>':'')+
    '<form id="f"><select name="svc" aria-label="서비스">'+list(S.contactOptions,function(o){return '<option>'+e(o)+'</option>'})+'</select>'+
    '<input name="name" placeholder="성함" required><input name="phone" type="tel" placeholder="연락처" required>'+
    '<textarea name="msg" rows="4" placeholder="지역과 증상을 간단히 적어주세요"></textarea>'+
    '<button class="btn" type="submit">문자로 문의 보내기</button><p class="note">버튼을 누르면 휴대폰 문자 앱이 열립니다.</p></form>'+
    '<p style="margin-top:16px">'+
      (S.kakaoUrl?'<a class="btn ghost" href="'+e(S.kakaoUrl)+'" target="_blank" rel="noopener">카카오톡 상담</a>':'')+
      (S.blogUrl?'<a class="btn ghost" href="'+e(S.blogUrl)+'" target="_blank" rel="noopener">블로그 보기</a>':'')+'</p>'+
  '</div></section></main>'+

  '<footer><div class="wrap"><b>'+e(S.pageTitle)+'</b><br>대표 '+e(S.owner)+' · 전화 <a href="'+e(tel)+'">'+e(S.phone)+'</a>'+(S.company?'<br>사업자등록번호 '+e(S.company.bizNo)+' · 통신판매업신고번호 '+e(S.company.mailOrderNo)+'<br>'+e(S.company.address):'')+'<br>© '+new Date().getFullYear()+' All rights reserved.</div></footer>'+
  '<a class="btn fab" href="'+e(tel)+'">📞 전화상담</a>';

  $("#app").innerHTML=html;
  document.title=S.pageTitle||document.title;
  var md=$('meta[name=description]');if(md)md.setAttribute("content",S.description||"");

  var tabs=document.querySelectorAll("#about .tabs button");
  tabs.forEach(function(b){b.addEventListener("click",function(){
    tabs.forEach(function(x){x.setAttribute("aria-selected",x===b?"true":"false")});
    $("#tab-g").hidden=b.dataset.tab!=="g";$("#tab-o").hidden=b.dataset.tab!=="o";
  })});
  document.querySelectorAll(".ptabs button").forEach(function(b){b.addEventListener("click",function(){
    var sec=b.closest("section");
    sec.querySelectorAll(".ptabs button").forEach(function(x){x.setAttribute("aria-selected",x===b?"true":"false")});
    sec.querySelectorAll(".pp").forEach(function(p){p.hidden=p.id!=="pp-"+sec.id+"-"+b.dataset.p});
  })});
  // ---------- 고객센터 게시판 (브라우저 저장소 기반) ----------
  (function(){
    var B=S.board,main=$("#board-main");if(!B||!main)return;
    var mem={};
    var store={get:function(k){try{var v=localStorage.getItem(k);return v==null?(k in mem?mem[k]:null):v}catch(x){return k in mem?mem[k]:null}},
      set:function(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(x){}}};
    var st={tab:"inquiry",view:"list",page:1,sort:"new",id:null,unlocked:{},msg:"",err:""};
    var cfg=function(id){return B.boards.filter(function(b){return b.id===id})[0]};
    var load=function(id){var raw=store.get("hrc-board-"+id);if(raw){try{return JSON.parse(raw)}catch(x){}}
      var seed=JSON.parse(JSON.stringify(cfg(id).seed||[]));save(id,seed);return seed};
    var save=function(id,arr){store.set("hrc-board-"+id,JSON.stringify(arr))};
    var today=function(){var d=new Date();return d.getFullYear()+"."+("0"+(d.getMonth()+1)).slice(-2)+"."+("0"+d.getDate()).slice(-2)};
    var mask=function(p){var d=String(p||"").replace(/[^0-9]/g,"");return d.length>=7?d.slice(0,3)+"****":""};
    var find=function(arr,id){return arr.filter(function(p){return p.id===id})[0]};

    function renderList(){
      var cf=cfg(st.tab),arr=load(st.tab).slice();
      var key={new:function(a,b){return a.date===b.date?b.id-a.id:(a.date<b.date?1:-1)},views:function(a,b){return b.views-a.views},likes:function(a,b){return b.likes-a.likes}}[st.sort];
      var sorted=arr.slice().sort(key),total=sorted.length,ps=B.pageSize||10,pages=Math.max(1,Math.ceil(total/ps));
      if(st.page>pages)st.page=pages;
      var rows=sorted.slice((st.page-1)*ps,st.page*ps);
      var h=(st.msg?'<p class="btoast">'+e(st.msg)+'</p>':'')+'<h3>'+e(cf.label)+'</h3><div class="btop"><span>전체 '+total+'</span><select id="bsort" aria-label="정렬"><option value="new"'+(st.sort==="new"?" selected":"")+'>최신순</option><option value="views"'+(st.sort==="views"?" selected":"")+'>조회순</option><option value="likes"'+(st.sort==="likes"?" selected":"")+'>추천순</option></select></div>'+
        '<table class="btbl"><thead><tr><th class="hm">번호</th><th>제목</th><th>작성자</th><th class="hm">작성일</th><th class="hm">추천</th><th class="hm">조회</th></tr></thead><tbody>'+
        (rows.length?rows.map(function(p){return '<tr><td class="hm">'+p.id+'</td><td class="t"><a data-open="'+p.id+'">'+(p.secret?'🔒 ':'')+e(p.title)+'</a>'+(p.reply?'<span class="rc">(1)</span>':'')+'</td><td>'+e(p.author)+'</td><td class="hm">'+e(p.date)+'</td><td class="hm">'+p.likes+'</td><td class="hm">'+p.views+'</td></tr>'}).join(""):'<tr><td colspan="6">등록된 글이 없습니다.</td></tr>')+
        '</tbody></table><div class="bpager">'+(function(){var s="";for(var i=1;i<=pages;i++)s+='<button type="button" data-pg="'+i+'"'+(i===st.page?' aria-current="true"':'')+'>'+i+'</button>';return s})()+'</div>'+
        (cf.writable?'<button type="button" class="bbtn pri" data-act="write">글쓰기</button>':'');
      st.msg="";main.innerHTML=h;
    }
    function renderPw(p){
      main.innerHTML='<h3>'+e(cfg(st.tab).label)+'</h3><form class="bform" id="bpw"><p>🔒 비밀글입니다. 작성 시 입력한 비밀번호를 입력해 주세요.</p><label>비밀번호<input id="bpwin" type="password" autocomplete="off"></label>'+(st.err?'<p class="berr">'+e(st.err)+'</p>':'')+'<div><button type="submit" class="bbtn pri">확인</button><button type="button" class="bbtn" data-act="list">목록보기</button></div></form>';st.err="";
    }
    function renderView(){
      var arr=load(st.tab),p=find(arr,st.id);if(!p){st.view="list";return render()}
      var liked=store.get("hrc-liked-"+st.tab+"-"+p.id);
      main.innerHTML=(st.msg?'<p class="btoast">'+e(st.msg)+'</p>':'')+'<div class="bview"><h3>'+e(cfg(st.tab).label)+'</h3><h4>'+(p.secret?'🔒 ':'')+e(p.title)+'</h4><div class="bmeta"><span>작성자 '+e(p.author)+'</span><span>작성일 '+e(p.date)+'</span><span>조회 '+p.views+'</span><span>추천 '+p.likes+'</span></div>'+
        (p.phone?'<p class="meta">전화번호 : '+e(mask(p.phone))+'</p>':'')+'<div class="bbody">'+e(p.content)+(p.image?'<img src="'+e(p.image)+'" alt="첨부 사진">':'')+'</div>'+
        (p.reply?'<div class="breply"><b>홈로취케어 답변</b><p style="margin-top:6px;max-width:none">'+e(p.reply)+'</p></div>':'')+
        '<div><button type="button" class="bbtn" data-act="list">목록보기</button><button type="button" class="bbtn" data-act="like"'+(liked?' disabled':'')+'>👍 추천 '+p.likes+'</button>'+(p.pw&&cfg(st.tab).writable?'<button type="button" class="bbtn" data-act="del">삭제</button>':'')+'</div><form class="bform" id="bdel" hidden style="margin-top:12px"><label>비밀번호 확인<input id="bdelpw" type="password" autocomplete="off"></label><div><button type="submit" class="bbtn pri">삭제하기</button></div><p class="berr" id="bdelerr"></p></form></div>';st.msg="";
    }
    function renderWrite(){
      var cf=cfg(st.tab);
      main.innerHTML='<h3>'+e(cf.label)+' 글쓰기</h3><form class="bform" id="bwrite"><label>이름<input id="bw-name" required maxlength="20"></label><label>비밀번호 (수정·삭제·비밀글 열람용, 4자 이상)<input id="bw-pw" type="password" required minlength="4" maxlength="30" autocomplete="new-password"></label><label>연락처<input id="bw-phone" type="tel" maxlength="20" placeholder="010-0000-0000"></label><label>제목<input id="bw-title" required maxlength="80"></label><label>내용<textarea id="bw-content" rows="8" required maxlength="3000"></textarea></label><label>사진 첨부 (선택)<input id="bw-img" type="file" accept="image/*"></label><label style="display:flex;gap:8px;align-items:center;color:var(--fg)"><input id="bw-secret" type="checkbox" style="width:auto"'+(cf.secretDefault?' checked':'')+'> 비밀글로 등록</label><p class="berr" id="bw-err"></p><div><button type="submit" class="bbtn pri">등록</button><button type="button" class="bbtn" data-act="list">취소</button></div></form>';
    }
    function render(){({list:renderList,view:renderView,write:renderWrite}[st.view]||renderList)()}
    function open(id){
      var arr=load(st.tab),p=find(arr,id);if(!p)return;st.id=id;
      if(p.secret&&!st.unlocked[st.tab+id]){st.view="pw";renderPw(p);return}
      p.views++;save(st.tab,arr);st.view="view";renderView();
    }
    function shrink(file,cb){
      var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=800,s=Math.min(1,m/Math.max(im.width,im.height)),cv=document.createElement("canvas");cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext("2d").drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL("image/jpeg",.7))};im.onerror=function(){cb("")};im.src=fr.result};fr.onerror=function(){cb("")};fr.readAsDataURL(file);
    }
    main.addEventListener("click",function(ev){
      var t=ev.target.closest("[data-open],[data-pg],[data-act]");if(!t)return;
      if(t.dataset.open){open(+t.dataset.open);return}
      if(t.dataset.pg){st.page=+t.dataset.pg;renderList();return}
      var a=t.dataset.act;
      if(a==="list"){st.view="list";renderList()}
      else if(a==="write"){st.view="write";renderWrite()}
      else if(a==="like"){var arr=load(st.tab),p=find(arr,st.id);p.likes++;save(st.tab,arr);store.set("hrc-liked-"+st.tab+"-"+p.id,"1");renderView()}
      else if(a==="del"){var f=$("#bdel");f.hidden=!f.hidden;if(!f.hidden)$("#bdelpw").focus()}
    });
    main.addEventListener("change",function(ev){if(ev.target.id==="bsort"){st.sort=ev.target.value;st.page=1;renderList()}});
    main.addEventListener("submit",function(ev){
      ev.preventDefault();var f=ev.target.id;
      if(f==="bpw"){var arr=load(st.tab),p=find(arr,st.id);
        if($("#bpwin").value===p.pw){st.unlocked[st.tab+st.id]=true;open(st.id)}else{st.err="비밀번호가 일치하지 않습니다.";renderPw(p)}}
      else if(f==="bdel"){var arr=load(st.tab),p=find(arr,st.id);
        if($("#bdelpw").value===p.pw){save(st.tab,arr.filter(function(x){return x.id!==p.id}));st.view="list";st.msg="글이 삭제되었습니다.";renderList()}else{$("#bdelerr").textContent="비밀번호가 일치하지 않습니다."}}
      else if(f==="bwrite"){
        var go=function(img){var arr=load(st.tab),id=arr.reduce(function(m,x){return Math.max(m,x.id)},0)+1;
          arr.push({id:id,title:$("#bw-title").value.trim(),author:$("#bw-name").value.trim(),date:today(),views:0,likes:0,secret:$("#bw-secret").checked,pw:$("#bw-pw").value,phone:$("#bw-phone").value.trim(),content:$("#bw-content").value.trim(),image:img||"",reply:null});
          save(st.tab,arr);st.view="list";st.page=1;st.sort="new";st.msg="글이 등록되었습니다.";renderList()};
        var file=$("#bw-img").files[0];if(file)shrink(file,go);else go("");
      }
    });
    $("#btabs").addEventListener("click",function(ev){
      var b=ev.target.closest("button[data-b]");if(!b)return;
      st.tab=b.dataset.b;st.view="list";st.page=1;st.sort="new";
      document.querySelectorAll("#btabs button").forEach(function(x){x.setAttribute("aria-selected",x===b?"true":"false")});renderList();
    });
    renderList();
  })();

  $("#f").addEventListener("submit",function(ev){
    ev.preventDefault();
    var d=new FormData(ev.target);
    var body="["+d.get("svc")+"]\n성함: "+d.get("name")+"\n연락처: "+d.get("phone")+"\n"+(d.get("msg")||"");
    location.href="sms:"+S.smsNumber+"?body="+encodeURIComponent(body);
  });
})();
</script>
