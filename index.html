  ((S.gallery||[]).length?'<section id="gallery" class="alt"><div class="wrap"><h2>시공 사례</h2><p class="sub">실제 현장 기록입니다.</p><div class="grid">'+

  (function(){
    var root=$("#slider");if(!root)return;
    var slides=root.querySelectorAll(".slide"),dots=root.querySelectorAll(".sl-dots button"),cur=0,timer=null,hover=false;
    var ms=(S.slider&&S.slider.interval)||5000;
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function go(n){cur=(n+slides.length)%slides.length;
      slides.forEach(function(s,i){s.classList.toggle("on",i===cur)});
      dots.forEach(function(d,i){d.setAttribute("aria-current",i===cur?"true":"false")})}
    function stop(){if(timer){clearInterval(timer);timer=null}}
    function start(){stop();if(reduce||slides.length<2)return;timer=setInterval(function(){if(!hover&&!document.hidden)go(cur+1)},ms)}
    root.querySelector(".sl-prev").addEventListener("click",function(){go(cur-1);start()});
    root.querySelector(".sl-next").addEventListener("click",function(){go(cur+1);start()});
    dots.forEach(function(d){d.addEventListener("click",function(){go(+d.dataset.i);start()})});
    root.addEventListener("mouseenter",function(){hover=true});root.addEventListener("mouseleave",function(){hover=false});
    root.addEventListener("focusin",function(){hover=true});root.addEventListener("focusout",function(){hover=false});
    var x0=null;root.addEventListener("touchstart",function(ev){x0=ev.touches[0].clientX},{passive:true});
    root.addEventListener("touchend",function(ev){if(x0==null)return;var dx=ev.changedTouches[0].clientX-x0;if(Math.abs(dx)>40){go(cur+(dx<0?1:-1));start()}x0=null});
    start();
  })();
